apiVersion: v1
kind: Service
metadata:
  name: application-only-demo
  namespace: lifecycle-demo
spec:
  clusterIP: None
  selector:
    app: application-only-demo
  ports:
    - name: app
      port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: application-only-demo
  namespace: lifecycle-demo
  labels:
    lifecycle.example.com/policy: application-only
spec:
  serviceName: application-only-demo
  replicas: 2
  selector:
    matchLabels:
      app: application-only-demo
  template:
    metadata:
      labels:
        app: application-only-demo
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10.1
          ports:
            - name: app
              containerPort: 8080
        # The named-container policy ignores sidecar-only image changes.
        - name: sidecar
          image: registry.k8s.io/pause:3.10.1
