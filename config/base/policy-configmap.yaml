apiVersion: v1
kind: ConfigMap
metadata:
  name: workload-lifecycle-policies
  namespace: lifecycle-system
  labels:
    app.kubernetes.io/name: workload-lifecycle-controller
data:
  policies.yaml: |
    apiVersion: lifecycle.example.com/v1alpha1
    kind: WorkloadLifecyclePolicySet
    spec:
      policies:
        # containers omitted: every regular container image is revision-significant.
        - name: default-all-containers
          priority: 100
          target:
            kinds:
              - Deployment
              - StatefulSet
            selector:
              matchLabels:
                lifecycle.example.com/policy: all-containers
          lifecycle:
            maxAge: 72h
            revision:
              source: ContainerImages
          replicas:
            scheduledDown: 0
            expired: 0
          schedule:
            timeZone: Asia/Shanghai
            downWindows:
              - name: weekday-early-morning
                startDays: [MON, TUE, WED, THU, FRI]
                start: "00:00"
                end: "08:00"
              - name: weekend-all-day
                startDays: [SAT, SUN]
                allDay: true
        # Optional guidance: name containers to ignore sidecar-only image changes.
        - name: application-container-only
          priority: 100
          target:
            kinds:
              - Deployment
              - StatefulSet
            selector:
              matchLabels:
                lifecycle.example.com/policy: application-only
          lifecycle:
            maxAge: 168h
            revision:
              source: ContainerImages
              containers:
                - app
          replicas:
            scheduledDown: 0
            expired: 0
          schedule:
            timeZone: America/Los_Angeles
            downWindows:
              - name: nightly-cross-midnight
                startDays: [MON, TUE, WED, THU, FRI, SAT, SUN]
                start: "22:00"
                end: "08:00"
