apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-lifecycle-controller
  namespace: lifecycle-system
  labels:
    app.kubernetes.io/name: workload-lifecycle-controller
    app.kubernetes.io/part-of: workload-lifecycle-controller
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-lifecycle-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-lifecycle-controller
        app.kubernetes.io/part-of: workload-lifecycle-controller
    spec:
      serviceAccountName: workload-lifecycle-controller
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: gitlab.glb.osl-nucleus.com/devops/kube-workload-lifecycle-manager:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POLICY_CONFIGMAP
              value: workload-lifecycle-policies
            - name: STATE_CONFIGMAP
              value: workload-lifecycle-state
            - name: LEADER_ELECTION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LEADER_ELECTION_NAME
              value: workload-lifecycle-controller
            - name: OBSERVABILITY_ADDR
              value: ":8080"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
