apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/part-of: workload-lifecycle-controller
  name: lifecycle-system
---
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: workload-lifecycle-controller
    app.kubernetes.io/part-of: workload-lifecycle-controller
  name: workload-lifecycle-controller
  namespace: lifecycle-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-lifecycle-controller
  namespace: lifecycle-system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resourceNames:
  - workload-lifecycle-state
  resources:
  - configmaps
  verbs:
  - update
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
- apiGroups:
  - coordination.k8s.io
  resourceNames:
  - workload-lifecycle-controller
  resources:
  - leases
  verbs:
  - get
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: workload-lifecycle-controller
  name: workload-lifecycle-controller
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - watch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments/scale
  - statefulsets/scale
  verbs:
  - get
  - update
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-lifecycle-controller
  namespace: lifecycle-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-lifecycle-controller
subjects:
- kind: ServiceAccount
  name: workload-lifecycle-controller
  namespace: lifecycle-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: workload-lifecycle-controller
  name: workload-lifecycle-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workload-lifecycle-controller
subjects:
- kind: ServiceAccount
  name: workload-lifecycle-controller
  namespace: lifecycle-system
---
apiVersion: v1
data:
  policies.yaml: |
    apiVersion: lifecycle.example.com/v1alpha1
    kind: WorkloadLifecyclePolicySet
    spec:
      policies:
        - name: pfb-workload
          priority: 50
          target:
            kinds:
              - Deployment
              - StatefulSet
            namePatterns:
              - ".*pfb\\d+"
              - "staging-.*"
          lifecycle:
            maxAge: 48h
            # expiredAction: "scale" (default) or "delete"
            # When set to "delete", expired workloads are deleted instead of scaled down.
            expiredAction: delete
            revision:
              source: ContainerImages
          replicas:
            scheduledDown: 0
            expired: 0
          schedule:
            timeZone: Asia/Shanghai
            downWindows:
              - name: weekday-early-morning
                startDays: [MON, TUE, WED, THU, FRI]
                start: "00:00"
                end: "08:00"
              - name: weekend-all-day
                startDays: [SAT, SUN]
                allDay: true
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: workload-lifecycle-controller
  name: workload-lifecycle-policies
  namespace: lifecycle-system
---
apiVersion: v1
data:
  states.json: |
    {
      "formatVersion": 1,
      "states": {}
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: workload-lifecycle-controller
  name: workload-lifecycle-state
  namespace: lifecycle-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: workload-lifecycle-controller
  name: workload-lifecycle-controller-metrics
  namespace: lifecycle-system
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app.kubernetes.io/name: workload-lifecycle-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: workload-lifecycle-controller
    app.kubernetes.io/part-of: workload-lifecycle-controller
  name: workload-lifecycle-controller
  namespace: lifecycle-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: workload-lifecycle-controller
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workload-lifecycle-controller
        app.kubernetes.io/part-of: workload-lifecycle-controller
    spec:
      containers:
      - env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POLICY_CONFIGMAP
          value: workload-lifecycle-policies
        - name: STATE_CONFIGMAP
          value: workload-lifecycle-state
        - name: LEADER_ELECTION_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: LEADER_ELECTION_NAME
          value: workload-lifecycle-controller
        - name: OBSERVABILITY_ADDR
          value: :8080
        image: gitlab.glb.osl-nucleus.com/devops/kube-workload-lifecycle-manager:v0.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        name: controller
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: workload-lifecycle-controller
      terminationGracePeriodSeconds: 30
